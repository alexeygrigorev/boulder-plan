    end: '46:00'
    kind: 'Технический блок'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Отработай «Открытый хват и half crimp». Шаги: Открытый хват: пальцы более вытянуты, большой палец не закрывает указательный. Half crimp: средние суставы согнуты примерно до прямого угла, большой палец не накрывает указательный. Выбери позицию до загрузки; не перекатывайся между ними под весом.
  - id: 'b09'
