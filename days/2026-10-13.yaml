blocks:
  - id: 'b01'
    start: '00:00'
    end: '03:00'
    kind: 'Самопроверка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Оцени плечо, пальцы и правое колено 0–10; проверь отсутствие острой боли, отёка, щелчка/«попа» в пальце и необычной нестабильности.
  - id: 'b02'
    start: '03:00'
    end: '08:00'
    kind: 'Разминка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Подними температуру: быстрая ходьба, лестница или лёгкий велотренажёр 5 минут.
  - id: 'b03'
    start: '08:00'
    end: '13:00'
    kind: 'Разминка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Динамически разомни голеностоп, таз, локти и кисти; сделай мягкие движения лопатками в безболезненном диапазоне. Не удерживай длинные статические растяжки.
  - id: 'b04'
    start: '13:00'
    end: '17:00'
    kind: 'Разминка пальцев'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      10 раз медленно раскрой/закрой кисти, 10 мягких сгибаний/разгибаний кистей и 10 лёгких касаний большим пальцем остальных. Никакого агрессивного растягивания пальцев.
  - id: 'b05'
    start: '17:00'
    end: '21:00'
    kind: 'Разминочное лазание'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 очень лёгкие трассы уровня 1–2; двигайся медленно, спускайся по зацепам.
  - id: 'b06'
    start: '21:00'
    end: '25:00'
    kind: 'Разминочное лазание'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 трассы уровня 2–3, затем сделай 2–3 движения на комфортной четвёрке. Между ними 45–60 секунд.
  - id: 'b07'
    start: '25:00'
    end: '29:00'
    kind: 'Выбор трасс'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Найди трассы для упражнения: 3 лёгкие вертикальные трассы 2–3. На каждой намеренно найти 2 места для flagging, даже если можно пройти без него.
  - id: 'b08'
    start: '29:00'
    end: '46:00'
    kind: 'Технический блок'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Отработай «Flagging». Шаги: Оставь свободную ногу на стене или проведи её за опорной ногой. Вытяни её ровно настолько, чтобы таз перестал вращаться. Сохрани вес на опорной стопе и руку максимально спокойной.
  - id: 'b09'
    start: '46:00'
    end: '51:00'
    kind: 'Обратная связь'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Повтори лучшую лёгкую трассу и проверь критерий успеха: Корпус меньше раскрывается, а усилие руки субъективно ниже минимум на 1 балл из 10.
  - id: 'b10'
    start: '51:00'
    end: '66:00'
    kind: 'Качественный объём'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Попробуй 2–3 четвёрки, максимум 2 попытки на каждую, отдых 2:00. На неудаче назови техническую причину.
  - id: 'b11'
    start: '66:00'
    end: '75:00'
    kind: 'Рабочая пятёрка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Одна пятёрка, максимум 2 попытки, отдых 3:00. Цель — применить тему недели, а не обязательно закрыть.
  - id: 'b12'
    start: '75:00'
    end: '84:00'
    kind: 'Лёгкая выносливость'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Начни 2 раунда × 3 очень лёгкие трассы. Маршруты 1–3, отдых между трассами 30–45 сек, между раундами до 4 мин. Если весь объём не помещается — завершить по таймеру.
  - id: 'b13'
    start: '84:00'
    end: '87:00'
    kind: 'Завершение'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Очень лёгкий спуск/ходьба и спокойное встряхивание кистей.
  - id: 'b14'
    start: '87:00'
    end: '90:00'
    kind: 'Журнал'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Запиши: Сделать одну и ту же лёгкую трассу без flagging и с ним; оценить усилие рук 1–10. Также отметь минуту первой просадки хвата. 📝
sections:
  - heading: 'Карточка техники'
    body: |
      **Установка:** Лёгкая вертикальная трасса 2–3, где в нескольких позициях остаются три точки контакта.

      **Последовательность:**

      - [ ] 1. Оставь свободную ногу на стене или проведи её за опорной ногой.
      - [ ] 2. Вытяни её ровно настолько, чтобы таз перестал вращаться.
      - [ ] 3. Сохрани вес на опорной стопе и руку максимально спокойной.
      - [ ] 4. Сравни одно движение без флага и с флагом.

      **Критерий успеха:** Корпус меньше раскрывается, а усилие руки субъективно ниже минимум на 1 балл из 10.

      **Частые ошибки:** Поднимать свободную ногу слишком высоко; терять давление опорной стопы; использовать флаг как мах.

      **Осторожность:** Не уходить в крайнее положение плеча. Smearing только на чистой поверхности и без резкого скольжения.
  - heading: 'Когда закончить раньше'
    body: |
      - [ ] Останови тяжёлый блок после **двух попыток подряд, которые явно хуже предыдущих**.
      - [ ] Останови пальцевую нагрузку при острой локальной боли, щелчке/«попе», отёке или внезапной потере силы.
      - [ ] Смени трассу при боли плеча в press/mantle, широкой компрессии или болезненном lock-off.
      - [ ] Уменьши/убери high step, heel hook или drop knee, если правое колено болит или ощущается скручивание.
  - heading: 'Быстрая запись'
    body: |
      - [ ] Статус дня внесён в Excel.
      - [ ] Лучшее техническое наблюдение записано одной фразой.
      - [ ] Реакции плеча / пальцев / колена записаны по шкале 0–10.
