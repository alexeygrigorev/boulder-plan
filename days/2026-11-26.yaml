blocks:
  - id: 'b01'
    start: '00:00'
    end: '03:00'
    kind: 'Самопроверка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Оцени плечо, пальцы и правое колено 0–10; проверь отсутствие острой боли, отёка, щелчка/«попа» в пальце и необычной нестабильности.
  - id: 'b02'
    start: '03:00'
    end: '08:00'
    kind: 'Разминка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Подними температуру: быстрая ходьба, лестница или лёгкий велотренажёр 5 минут.
  - id: 'b03'
    start: '08:00'
    end: '13:00'
    kind: 'Разминка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Динамически разомни голеностоп, таз, локти и кисти; сделай мягкие движения лопатками в безболезненном диапазоне. Не удерживай длинные статические растяжки.
  - id: 'b04'
    start: '13:00'
    end: '17:00'
    kind: 'Разминка пальцев'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      10 раз медленно раскрой/закрой кисти, 10 мягких сгибаний/разгибаний кистей и 10 лёгких касаний большим пальцем остальных. Никакого агрессивного растягивания пальцев.
  - id: 'b05'
    start: '17:00'
    end: '21:00'
    kind: 'Разминочное лазание'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 очень лёгкие трассы уровня 1–2; двигайся медленно, спускайся по зацепам.
  - id: 'b06'
    start: '21:00'
    end: '25:00'
    kind: 'Разминочное лазание'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 трассы уровня 2–3, затем сделай 2–3 движения на комфортной четвёрке. Между ними 45–60 секунд.
  - id: 'b07'
    start: '25:00'
    end: '28:00'
    kind: 'Фингерборд — готовность'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Выбери самую большую удобную закруглённую кромку (ориентир 25–30 мм). Две руки, четыре пальца, ноги на полу/ступени снимают вес.
  - id: 'b08'
    start: '28:00'
    end: '43:00'
    kind: 'Фингерборд'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Выполни протокол: 3 × 7 сек, ноги помогают, RPE 6, либо пропуск. Запусти таймер. Каждый вис прекращай с указанным запасом; форма кисти не меняется.
  - id: 'b09'
    start: '43:00'
    end: '46:00'
    kind: 'Фингерборд — запись'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Запиши кромку/опору ног, фактические секунды и RPE последнего повтора. Прогрессировать можно только одним параметром за раз и только на следующей неделе. 📝
  - id: 'b10'
    start: '46:00'
    end: '51:00'
    kind: 'Отдых'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      5 минут полного отдыха: ходьба, вода, без лазания.
  - id: 'b11'
    start: '51:00'
    end: '55:00'
    kind: 'Выбор проекта'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Выбери трассу по критериям недели: Контрольная шестёрка с крупными/средними зацепами и без болезненного press; 15–20 минут качественной работы.
  - id: 'b12'
    start: '55:00'
    end: '60:00'
    kind: 'Проект — попытка 1'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Сделай первую полную диагностическую попытку. После падения не повторяй сразу: назови точную причину.
  - id: 'b13'
    start: '60:00'
    end: '65:00'
    kind: 'Отдых / гипотеза'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Отдых 4–5 минут. Запиши одну гипотезу: стопа, положение таза, хват или темп. 📝
  - id: 'b14'
    start: '65:00'
    end: '71:00'
    kind: 'Проект — попытки 2–3'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Сделай 1–2 попытки, меняя только выбранную переменную. После 2–3 собственных попыток разрешено посмотреть BETA7/попросить одну подсказку.
  - id: 'b15'
    start: '71:00'
    end: '76:00'
    kind: 'Проект — заключительная попытка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Сними одну попытку целиком. Сделай последнюю качественную попытку только если пальцы и техника не хуже первой. После двух ухудшений подряд проект закончен.
  - id: 'b16'
    start: '76:00'
    end: '83:00'
    kind: 'Вторичная трасса'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Выбери одну трассу другого стиля: знакомую пятёрку или лёгкую четвёрку. Максимум 2 попытки; цель — закончить точным движением.
  - id: 'b17'
    start: '83:00'
    end: '87:00'
    kind: 'Завершение'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Очень лёгкий спуск/ходьба, вода.
  - id: 'b18'
    start: '87:00'
    end: '90:00'
    kind: 'Журнал'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Запиши попытки, лучшую связку, одну правку и benchmark: Тест 3 месяцев: 4 четвёрки, 4 пятёрки, 1 шестёрка. Успех = ясная бета и связка нескольких движений; полный топ — бонус. 📝
sections:
  - heading: 'Карточка техники'
    body: |
      **Установка:** Лёгкое нависание 2–3 с крупными ногами; падение безопасное, но цель — удержать стопы.

      **Последовательность:**

      - [ ] 1. До движения создай давление через обе стопы.
      - [ ] 2. Слегка напряги корпус, не задерживая дыхание.
      - [ ] 3. Соедини противоположную руку и ногу через тело.
      - [ ] 4. Двигай рукой, сохраняя стопы на стене.

      **Критерий успеха:** Меньше срезаний ног; после захвата корпус не раскачивается.

      **Частые ошибки:** Тянуться одной рукой без давления ног; чрезмерно зажиматься; задерживать дыхание.

      **Осторожность:** При плечевой боли выбрать меньший угол.
  - heading: 'Когда закончить раньше'
    body: |
      - [ ] Останови тяжёлый блок после **двух попыток подряд, которые явно хуже предыдущих**.
      - [ ] Останови пальцевую нагрузку при острой локальной боли, щелчке/«попе», отёке или внезапной потере силы.
      - [ ] Смени трассу при боли плеча в press/mantle, широкой компрессии или болезненном lock-off.
      - [ ] Уменьши/убери high step, heel hook или drop knee, если правое колено болит или ощущается скручивание.
  - heading: 'Быстрая запись'
    body: |
      - [ ] Статус дня внесён в Excel.
      - [ ] Лучшее техническое наблюдение записано одной фразой.
      - [ ] Реакции плеча / пальцев / колена записаны по шкале 0–10.
