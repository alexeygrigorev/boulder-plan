    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 трассы уровня 2–3, затем сделай 2–3 движения на комфортной четвёрке. Между ними 45–60 секунд.
  - id: 'b07'
