    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Отработай «Разворот бедра и backstep». Шаги: Поставь одну стопу наружным ребром. Разверни соответствующее бедро к стене. Позволь тазу приблизиться к стене, сохраняя опорную руку спокойной.
  - id: 'b09'
    start: '46:00'
    end: '51:00'
    kind: 'Обратная связь'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
