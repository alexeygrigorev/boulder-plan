    kind: 'Рабочая пятёрка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Одна пятёрка, максимум 2 попытки, отдых 3:00. Цель — применить тему недели, а не обязательно закрыть.
  - id: 'b12'
    start: '75:00'
    end: '84:00'
    kind: 'Лёгкая выносливость'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Начни 2 раунда × 3 очень лёгкие трассы. Маршруты 1–3, отдых между трассами 30–45 сек, между раундами до 4 мин. Если весь объём не помещается — завершить по таймеру.
  - id: 'b13'
