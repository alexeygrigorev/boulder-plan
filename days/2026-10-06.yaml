    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Найди трассы для упражнения: 3 трассы 2–3 на вертикали/лёгком нависании, где можно пройти и лицом к стене, и с разворотом бедра.
  - id: 'b08'
