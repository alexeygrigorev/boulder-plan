blocks:
  - id: 'b01'
    start: '00:00'
    end: '03:00'
    kind: 'Самопроверка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Оцени плечо, пальцы и правое колено 0–10; проверь отсутствие острой боли, отёка, щелчка/«попа» в пальце и необычной нестабильности.
  - id: 'b02'
    start: '03:00'
    end: '08:00'
    kind: 'Разминка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Подними температуру: быстрая ходьба, лестница или лёгкий велотренажёр 5 минут.
  - id: 'b03'
    start: '08:00'
    end: '13:00'
    kind: 'Разминка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Динамически разомни голеностоп, таз, локти и кисти; сделай мягкие движения лопатками в безболезненном диапазоне. Не удерживай длинные статические растяжки.
  - id: 'b04'
    start: '13:00'
    end: '17:00'
    kind: 'Разминка пальцев'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      10 раз медленно раскрой/закрой кисти, 10 мягких сгибаний/разгибаний кистей и 10 лёгких касаний большим пальцем остальных. Никакого агрессивного растягивания пальцев.
  - id: 'b05'
    start: '17:00'
    end: '21:00'
    kind: 'Разминочное лазание'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 очень лёгкие трассы уровня 1–2; двигайся медленно, спускайся по зацепам.
  - id: 'b06'
    start: '21:00'
    end: '25:00'
    kind: 'Разминочное лазание'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Пройди 2 трассы уровня 2–3, затем сделай 2–3 движения на комфортной четвёрке. Между ними 45–60 секунд.
  - id: 'b07'
    start: '25:00'
    end: '29:00'
    kind: 'Выбор трасс'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Найди трассы для упражнения: 2 четвёрки для техники + 2 пятёрки, где можно изолировать одно трудное движение.
  - id: 'b08'
    start: '29:00'
    end: '46:00'
    kind: 'Технический блок'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Отработай «Разделение проекта». Шаги: Сделай одну полную диагностическую попытку. Отработай start → позиция перед crux. Отработай crux как отдельную задачу, если безопасно и не мешает людям.
  - id: 'b09'
    start: '46:00'
    end: '51:00'
    kind: 'Обратная связь'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Повтори лучшую лёгкую трассу и проверь критерий успеха: Получены минимум две повторяемые короткие связки.
  - id: 'b10'
    start: '51:00'
    end: '66:00'
    kind: 'Качественный объём'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Попробуй 2–3 четвёрки, максимум 2 попытки на каждую, отдых 2:00. На неудаче назови техническую причину.
  - id: 'b11'
    start: '66:00'
    end: '75:00'
    kind: 'Рабочая пятёрка'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Одна пятёрка, максимум 2 попытки, отдых 3:00. Цель — применить тему недели, а не обязательно закрыть.
  - id: 'b12'
    start: '75:00'
    end: '84:00'
    kind: 'Лёгкая выносливость'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Начни 2 раунда × 4 очень лёгкие трассы. Маршруты 1–3, отдых между трассами 30–45 сек, между раундами до 4 мин. Если весь объём не помещается — завершить по таймеру.
  - id: 'b13'
    start: '84:00'
    end: '87:00'
    kind: 'Завершение'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Очень лёгкий спуск/ходьба и спокойное встряхивание кистей.
  - id: 'b14'
    start: '87:00'
    end: '90:00'
    kind: 'Журнал'
    requirement: 'обязательно'
    section: 'Чек-лист по минутам'
    intensity: null
    text: |
      Запиши: Получить минимум две стабильные короткие связки, даже если полного прохода нет. Также отметь минуту первой просадки хвата. 📝
sections:
  - heading: 'Карточка техники'
    body: |
      **Установка:** Одна шестёрка без болезненных движений; заранее определить start, crux и top section.

      **Последовательность:**

      - [ ] 1. Сделай одну полную диагностическую попытку.
      - [ ] 2. Отработай start → позиция перед crux.
      - [ ] 3. Отработай crux как отдельную задачу, если безопасно и не мешает людям.
      - [ ] 4. Отработай crux → top, затем попробуй связать.

      **Критерий успеха:** Получены минимум две повторяемые короткие связки.

      **Частые ошибки:** Каждый раз лезть только с самого старта; менять несколько деталей; стартовать с середины опасным прыжком.

      **Осторожность:** При сомнении спросить сотрудника, можно ли безопасно начинать с нужной позиции.
  - heading: 'Когда закончить раньше'
    body: |
      - [ ] Останови тяжёлый блок после **двух попыток подряд, которые явно хуже предыдущих**.
      - [ ] Останови пальцевую нагрузку при острой локальной боли, щелчке/«попе», отёке или внезапной потере силы.
      - [ ] Смени трассу при боли плеча в press/mantle, широкой компрессии или болезненном lock-off.
      - [ ] Уменьши/убери high step, heel hook или drop knee, если правое колено болит или ощущается скручивание.
  - heading: 'Быстрая запись'
    body: |
      - [ ] Статус дня внесён в Excel.
      - [ ] Лучшее техническое наблюдение записано одной фразой.
      - [ ] Реакции плеча / пальцев / колена записаны по шкале 0–10.
